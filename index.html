// ── Helpers ───────────────────────────────────────────────────
function daysUntil(d) {
  if (!d) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const t = new Date(d); t.setHours(0,0,0,0);
  return Math.round((t - now) / 86400000);
}
function fmt(n) { return Number(n||0).toLocaleString('ko-KR'); }
function today() { return new Date().toISOString().split('T')[0]; }

function parseUrl(url) {
  try {
    const u = (url||'').trim();
    if (!u) return null;
    if (!u.startsWith('http')) return { name:u, source:'기타', icon:'🔗', color:'gray', url:u };
    const ig = u.match(/instagram\.com\/([^\/\?\s#&]+)/);
    if (ig && !['p','reel','stories','explore','tv'].includes(ig[1]))
      return { name:'인스타', source:'인스타', icon:'📸', color:'pink', url:u };
    if (u.includes('blog.naver.com')) return { name:'네이버블로그', source:'네이버블로그', icon:'📝', color:'green', url:u };
    if (u.includes('hogangnono.com')) return { name:'호갱노노', source:'호갱노노', icon:'🏘️', color:'indigo', url:u };
    if (u.includes('land.naver.com')) return { name:'네이버부동산', source:'네이버', icon:'🏠', color:'green', url:u };
    if (u.includes('zigbang.com'))    return { name:'직방', source:'직방', icon:'🏢', color:'blue', url:u };
    if (u.includes('youtube.com')||u.includes('youtu.be')) return { name:'유튜브', source:'유튜브', icon:'🎥', color:'red', url:u };
    const host = new URL(u).hostname.replace('www.','');
    return { name:host, source:host, icon:'🔗', color:'gray', url:u };
  } catch(e) { return { name:url||'', source:'기타', icon:'🔗', color:'gray', url:url }; }
}

function parseUrls(str) {
  if (!str) return [];
  return str.split('|||').map(u=>u.trim()).filter(Boolean).map(parseUrl).filter(Boolean);
}

};

function makeApi(baseUrl) {
  return async function(action, body=null) {
    const data = JSON.stringify({ action, ...(body||{}) });
    const url = `${baseUrl}?data=${encodeURIComponent(data)}`;
    try { const res = await fetch(url, { redirect:'follow' }); return await res.json(); }
    catch(e) { return { error: e.message }; }
  };
}

function getPhase() {
  const now = new Date();
  if (now < new Date('2026-05-23')) return { label:'D-400+ 구간' };
  if (now < new Date('2026-11-23')) return { label:'10개월 前' };
  if (now < new Date('2027-02-23')) return { label:'6개월 前' };
  if (now < new Date('2027-04-23')) return { label:'3개월 前' };
  return { label:'1개월 前' };
}

// Long press hook
function useLongPress(onLongPress, ms=600) {
  const timer = useRef(null);
  const start = useCallback(() => {
    timer.current = setTimeout(() => { onLongPress(); timer.current = null; }, ms);
  }, [onLongPress, ms]);
  const cancel = useCallback(() => {
    if (timer.current) { clearTimeout(timer.current); timer.current = null; }
  }, []);
  return { onTouchStart:start, onTouchEnd:cancel, onTouchMove:cancel, onMouseDown:start, onMouseUp:cancel, onMouseLeave:cancel };
}

// Number input with comma display
function NumInput({ value, onChange, placeholder, className }) {
  const display = value ? Number(String(value).replace(/[^0-9]/g,'')).toLocaleString('ko-KR') : '';
  function handleChange(e) { onChange(e.target.value.replace(/[^0-9]/g,'')); }
  return <input value={display} onChange={handleChange} placeholder={placeholder} className={className} inputMode="numeric" />;
}

function Card({ children, className='' }) {
  return <div className={`bg-white rounded-2xl shadow-sm p-4 ${className}`}>{children}</div>;
}
function ProgressBar({ value, max, className='' }) {
  const pct = max>0 ? Math.min(100,(value/max)*100) : 0;
  return <div className={`h-2 bg-gray-100 rounded-full overflow-hidden ${className}`}>
    <div className="h-full bg-gradient-to-r from-rose-400 to-pink-400 rounded-full transition-all" style={{width:`${pct}%`}}/>
  </div>;
}
function StatusBadge({ status }) {
  const map = {'✅ 완료':'bg-emerald-100 text-emerald-700','⏳ 진행중':'bg-amber-100 text-amber-700','🔲 미시작':'bg-gray-100 text-gray-500'};

// ── SetupScreen ───────────────────────────────────────────────
function SetupScreen({ onSave }) {
  const [url, setUrl] = useState('');
  const [testing, setTesting] = useState(false);
  const [err, setErr] = useState('');
  async function test() {
    setTesting(true); setErr('');
    try {
      const res = await makeApi(url.trim())('ping');
      if (res.status === 'ok') onSave(url.trim());
      else setErr('연결 실패: ' + (res.error||JSON.stringify(res)));
    } catch(e) { setErr('연결 실패: '+e.message); }
    finally { setTesting(false); }
  }
  return (
    <div className="min-h-screen flex items-center justify-center p-6 bg-gradient-to-b from-rose-50 to-pink-100">
      <div className="bg-white rounded-3xl shadow-xl p-8 w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="text-6xl mb-3">💍</div>
          <h1 className="text-2xl font-bold text-gray-800">처음 설정</h1>
          <p className="text-gray-500 text-sm mt-2">Google Apps Script 웹 앱 URL을 붙여넣으세요</p>
        </div>
        <textarea className="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-400 resize-none mb-2" rows={3} placeholder="https://script.google.com/macros/s/...exec" value={url} onChange={e=>setUrl(e.target.value)} />
        {err && <p className="text-red-500 text-xs mb-2">{err}</p>}
        <button onClick={test} disabled={!url||testing} className="w-full bg-gradient-to-r from-rose-500 to-pink-500 text-white rounded-xl py-3.5 font-bold disabled:opacity-40">
          {testing?'연결 확인 중...':'연결 & 시작하기 💕'}
        </button>
      </div>
    </div>
  );
}

function TodoPage({ todos, onToggle, onAdd, onEdit, onDelete }) {
  const [cat, setCat]           = useState('전체');
  const [sort, setSort]         = useState('added');
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving]     = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({ title:'', category:'한국결혼식', assignee:'나디아', deadline:'', priority:'🟡 보통', memo:'' });

  const cats = ['전체','한국결혼식','종교/교리','상견례','신혼집','인도네시아결혼식','신혼여행','기타'];
  const done = todos.filter(t=>t.status==='✅ 완료').length;

  let filtered = cat==='전체' ? todos : todos.filter(t=>t.category===cat);
  if (sort==='priority') {
    const order = {'🔴 높음':0,'🟡 보통':1,'🔵 낮음':2};
    filtered = [...filtered].sort((a,b)=>(order[a.priority]??9)-(order[b.priority]??9));
  } else if (sort==='deadline') {
    filtered = [...filtered].sort((a,b)=>{
      if (!a.deadline&&!b.deadline) return 0;
      if (!a.deadline) return 1; if (!b.deadline) return -1;
      return a.deadline.localeCompare(b.deadline);
    });
  }

  async function handleAdd() {
    if (!form.title) return; setSaving(true);
    await onAdd(form);
    setForm({ title:'', category:'한국결혼식', assignee:'나디아', deadline:'', priority:'🟡 보통', memo:'' });
    setShowForm(false); setSaving(false);
  }

  return (
    <div>
      {/* 진행률 헤더 */}
      <Card className="mb-3">
        <div className="flex justify-between items-center mb-2">
          <div>
            <p className="text-xs text-gray-400">전체 진행률</p>
            <p className="text-2xl font-black text-rose-500 leading-tight">
              {done}<span className="text-base text-gray-400 font-normal">/{todos.length}</span>
            </p>
          </div>
          <button onClick={()=>setShowForm(!showForm)} className="bg-rose-500 text-white w-9 h-9 rounded-full text-xl font-bold flex items-center justify-center shadow-sm active:opacity-70">
            {showForm ? '×' : '+'}
          </button>
        </div>
        <ProgressBar value={done} max={todos.length} />
      </Card>

      {/* 추가 폼 */}
      {showForm && (
        <Card className="mb-3 border border-rose-100">
          <div className="space-y-2.5">
            <div><label className="text-xs text-gray-500 mb-1 block">할일 *</label>
              <input placeholder="할일 제목" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} className={inp} />
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div><label className="text-xs text-gray-500 mb-1 block">카테고리</label>
                <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} className={inp}>
                  {['한국결혼식','인도네시아결혼식','종교/교리','상견례','신혼집','신혼여행','기타'].map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div><label className="text-xs text-gray-500 mb-1 block">담당</label>
                <select value={form.assignee} onChange={e=>setForm({...form,assignee:e.target.value})} className={inp}>
                  {['나디아','진혁','공동'].map(a=><option key={a}>{a}</option>)}
                </select>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div><label className="text-xs text-gray-500 mb-1 block">마감일</label>
                <input type="date" value={form.deadline} onChange={e=>setForm({...form,deadline:e.target.value})} className={inp} />
              </div>
              <div><label className="text-xs text-gray-500 mb-1 block">우선순위</label>
                <select value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})} className={inp}>
                  {['🔴 높음','🟡 보통','🔵 낮음'].map(p=><option key={p}>{p}</option>)}
                </select>
              </div>
            </div>
            <div><label className="text-xs text-gray-500 mb-1 block">메모</label>
              <input placeholder="메모" value={form.memo} onChange={e=>setForm({...form,memo:e.target.value})} className={inp} />
            </div>
            <div className="flex gap-2">
              <button onClick={()=>setShowForm(false)} className="flex-1 border border-gray-200 rounded-xl py-2.5 text-gray-500 text-sm font-semibold">취소</button>
              <button onClick={handleAdd} disabled={!form.title||saving} className="flex-1 bg-rose-500 text-white rounded-xl py-2.5 text-sm font-bold disabled:opacity-40">{saving?'저장중...':'추가'}</button>
            </div>
          </div>
        </Card>
      )}

      {/* 카테고리 필터 */}
      <div className="flex gap-2 overflow-x-auto pb-2 mb-2 no-scrollbar">
        {cats.map(c=>(
          <button key={c} onClick={()=>setCat(c)} className={`whitespace-nowrap px-3 py-1.5 rounded-full text-sm font-semibold transition-all ${cat===c?'bg-rose-500 text-white':'bg-white text-gray-500 border border-gray-200'}`}>{c}</button>
        ))}
      </div>
      {/* 정렬 */}
      <div className="flex gap-1.5 mb-3">
        {[['added','등록순'],['priority','우선순위순'],['deadline','마감일순']].map(([v,l])=>(
          <button key={v} onClick={()=>setSort(v)} className={`text-xs px-2.5 py-1 rounded-full font-semibold ${sort===v?'bg-gray-700 text-white':'bg-white text-gray-500 border border-gray-200'}`}>{l}</button>
        ))}
      </div>

      <div className="space-y-2">
        {filtered.length===0
          ? <Card><p className="text-center text-gray-400 text-sm py-4">할일이 없어요 🎉</p></Card>
          : filtered.map((t,i)=>{
              const isDone = t.status==='✅ 완료';
              const lp = useLongPress(()=>setEditItem(t));
              return (
                <div key={i} {...lp} className={`bg-white rounded-2xl shadow-sm border-l-4 select-none ${isDone?'border-emerald-300 opacity-50':t.priority==='🔴 높음'?'border-rose-400':'border-gray-200'}`}>
                  <button className="w-full text-left p-3.5 active:opacity-70" onClick={()=>onToggle(t)}>
                    <div className="flex items-start gap-3">
                      <span className="text-xl mt-0.5 flex-shrink-0">{isDone?'✅':'⬜'}</span>
                      <div className="flex-1 min-w-0">
                        <p className={`text-sm font-semibold ${isDone?'line-through text-gray-400':'text-gray-800'}`}>{t.title}</p>
                        <div className="flex flex-wrap items-center gap-1.5 mt-1">
                          {t.deadline && <span className="text-xs text-gray-400">📅 {t.deadline}</span>}
                          <span className="text-xs text-gray-400">· {t.assignee}</span>
                          <StatusBadge status={t.status}/>
                        </div>
                        {t.memo && <p className="text-xs text-gray-400 mt-1 truncate">{t.memo}</p>}
                      </div>
                    </div>
                  </button>
                </div>
              );
            })
        }
      </div>
      <p className="text-center text-xs text-gray-300 mt-3 mb-1">길게 누르면 편집</p>

      {editItem && (
        <TodoEditModal
          todo={editItem}
          onSave={async(data)=>{ await onEdit(data); setEditItem(null); }}
          onDelete={async(t)=>{ await onDelete(t); setEditItem(null); }}
          onClose={()=>setEditItem(null)}
        />
      )}
    </div>
  );
}

function BudgetPage({ contracts, onAdd, onEdit, onDelete }) {
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving]     = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({ name:'', category:'한국결혼식', deposit:'', total:'', balanceDate:'', status:'계약완료' });

  const totalDeposit  = contracts.reduce((s,c)=>s+(c.deposit||0),0);
  const totalEstimate = contracts.reduce((s,c)=>s+(c.total||0),0);
  const pct = Math.min(100,(totalEstimate/TOTAL_BUDGET)*100);
  const CATS = ['한국결혼식','인도네시아결혼식','신혼집','신혼여행','상견례','기타'];

  async function handleAdd() {
    if (!form.name) return; setSaving(true);
    const dep = Number(form.deposit)||0, tot = Number(form.total)||0;
    await onAdd({ ...form, deposit:dep, total:tot, balance:Math.max(0,tot-dep) });
    setForm({ name:'', category:'한국결혼식', deposit:'', total:'', balanceDate:'', status:'계약완료' });
    setShowForm(false); setSaving(false);

        <p className="text-3xl font-black">{fmt(totalEstimate)}<span className="text-base font-light">원</span></p>

            <p className="font-black text-base">{fmt(totalDeposit)}원</p>
          </div>
          <div className="bg-white/15 rounded-xl py-2">
            <p className="text-xs opacity-75">남은 잔금</p>
            <p className="font-black text-base">{fmt(Math.max(0,totalEstimate-totalDeposit))}원</p>
          </div>
        </div>
      </div>

      {/* 추가 버튼 */}

        {showForm ? '✕ 닫기' : '+ 항목 추가'}

      <div><label className="text-xs text-gray-500 mb-1 block">단지명 *</label>
        <input placeholder="남서울힐스테이트" value={form.name} onChange={e=>f('name',e.target.value)} className={inp}/>

      <div className="grid grid-cols-2 gap-2">
        <div><label className="text-xs text-gray-500 mb-1 block">구</label>
          <select value={form.gu} onChange={e=>{ f('gu',e.target.value); f('dong',''); }} className={inp}>
            <option value="">선택</option>
            {GU_OPTIONS.map(g=>(
              <optgroup key={g.group} label={g.group}>{g.items.map(item=><option key={item} value={item}>{item}</option>)}</optgroup>

          </select>
        </div>
        <div><label className="text-xs text-gray-500 mb-1 block">동</label>

          </select>

      <div className="grid grid-cols-2 gap-2">
        <div><label className="text-xs text-gray-500 mb-1 block">평수</label>
          <select value={form.pyung} onChange={e=>f('pyung',e.target.value)} className={inp}>
            <option value="">선택</option>
            {PYUNG_OPTIONS.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        <div><label className="text-xs text-gray-500 mb-1 block">연식 (준공연도)</label>
          <input placeholder="2015" value={form.builtYear} onChange={e=>f('builtYear',e.target.value)} className={inp} inputMode="numeric"/>
        </div>
      </div>
      <div className="grid grid-cols-2 gap-2">
        <div><label className="text-xs text-gray-500 mb-1 block">매매가</label>
          <input placeholder="8억 2천" value={form.salePrice} onChange={e=>f('salePrice',e.target.value)} className={inp}/>
        </div>
        <div><label className="text-xs text-gray-500 mb-1 block">전/월세가</label>
          <input placeholder="전세 4억" value={form.rentPrice} onChange={e=>f('rentPrice',e.target.value)} className={inp}/>
        </div>
      </div>
      <div><label className="text-xs text-gray-500 mb-1 block">호갱노노 URL</label>
        <input placeholder="https://hogangnono.com/..." value={form.hoganUrl} onChange={e=>f('hoganUrl',e.target.value)} className={inp}/>
      </div>
      <div><label className="text-xs text-gray-500 mb-1 block">네이버 부동산 URL</label>
        <input placeholder="https://land.naver.com/..." value={form.naverUrl} onChange={e=>f('naverUrl',e.target.value)} className={inp}/>
      </div>
      <div><label className="text-xs text-gray-500 mb-1 block">메모</label>
        <input placeholder="역 5분, 학군 좋음 등" value={form.memo} onChange={e=>f('memo',e.target.value)} className={inp}/>

    </div>

function splitRegion(r) {
  if (!r) return { gu:'', dong:'' };
  const allGus = GU_OPTIONS.flatMap(g=>g.items);
  for (const gu of allGus) {
    if (r.startsWith(gu)) {
      return { gu, dong: r.slice(gu.length).trim() };
    }
  }
  return { gu:r, dong:'' };
}

function HousingEditModal({ item, onSave, onDelete, onClose }) {
  const { gu:initGu, dong:initDong } = splitRegion(item.region||'');
  const [form, setForm] = useState({
    name:item.name||'', gu:initGu, dong:initDong,
    pyung:item.pyung||'', builtYear:item.builtYear||'',
    salePrice:item.salePrice||'', rentPrice:item.rentPrice||'',
    hoganUrl:item.hoganUrl||'', naverUrl:item.naverUrl||'', memo:item.memo||''
  });
  const [saving, setSaving] = useState(false);
  return (
    <BottomModal onClose={onClose}>
      <div className="px-5 pb-6">
        <div className="flex items-center justify-between mb-4">
          <p className="font-bold text-gray-800">단지 편집</p>
          <button onClick={onClose} className="text-gray-400 text-lg leading-none">✕</button>
        </div>
        <HousingFormFields form={form} setForm={setForm}/>
        <div className="flex gap-2 mt-4">
          <button onClick={async()=>{if(window.confirm(`"${item.name}" 삭제할까요?`)){await onDelete(item);onClose();}}} className="px-4 py-2.5 bg-red-50 text-red-500 rounded-xl text-sm font-semibold">삭제</button>
          <button onClick={async()=>{setSaving(true);const region=form.gu+(form.dong?' '+form.dong:'');await onSave({...item,...form,region});setSaving(false);onClose();}} disabled={!form.name||saving} className="flex-1 bg-indigo-500 text-white rounded-xl py-2.5 text-sm font-bold disabled:opacity-40">{saving?'저장중...':'저장'}</button>
        </div>
      </div>
    </BottomModal>
  );
}

function getBuiltAge(builtYear) {
  if (!builtYear) return '';
  const year = parseInt(builtYear);
  if (!year || isNaN(year)) return builtYear;
  const age = new Date().getFullYear() - year;
  return `${year}(${age}년차)`;
}

function HousingPage({ housing, onAdd, onDelete, onEdit, onUpdateVisit }) {
  const [showForm, setShowForm]   = useState(false);
  const [saving, setSaving]       = useState(false);
  const [editItem, setEditItem]   = useState(null);
  const [reviewTarget, setReviewTarget] = useState(null);
  const [reviewText, setReviewText]     = useState('');
  const [sort, setSort]           = useState('added');
  const [regionFilter, setRegionFilter] = useState('전체');
  const [addForm, setAddForm] = useState({ name:'', gu:'', dong:'', pyung:'', builtYear:'', salePrice:'', rentPrice:'', hoganUrl:'', naverUrl:'', memo:'' });

  async function handleSave() {
    if (!addForm.name) return;
    // 폼 즉시 닫고 목록으로
    setShowForm(false);
    setSaving(true);
    const region = addForm.gu + (addForm.dong ? ' '+addForm.dong : '');
    await onAdd({ ...addForm, region, date: today() });
    setAddForm({ name:'', gu:'', dong:'', pyung:'', builtYear:'', salePrice:'', rentPrice:'', hoganUrl:'', naverUrl:'', memo:'' });
    setSaving(false);
  }

  async function handleVisitToggle(h) {
    const newVal = h.visited === 'Y' ? '' : 'Y';
    await onUpdateVisit(h.rowIndex, newVal, h.visitReview||'');
  }
  async function handleReviewSave(h) {
    await onUpdateVisit(h.rowIndex, h.visited||'Y', reviewText);
    setReviewTarget(null); setReviewText('');
  }

  const guList = ['전체', ...new Set(housing.map(h=>splitRegion(h.region).gu).filter(Boolean))];
  let list = regionFilter==='전체' ? housing : housing.filter(h=>h.region.startsWith(regionFilter));
  if (sort==='price') {
    list = [...list].sort((a,b)=>{
      const pa=parseFloat((a.salePrice||'').replace(/[^0-9.]/g,''))||0;
      const pb=parseFloat((b.salePrice||'').replace(/[^0-9.]/g,''))||0;
      return pa-pb;
    });
  } else if (sort==='region') {
    list = [...list].sort((a,b)=>(a.region||'').localeCompare(b.region||''));
  }

  return (
    <div>
      {/* 헤더 + 추가 버튼 한 줄에 */}
      <div className="bg-gradient-to-br from-indigo-500 to-purple-400 rounded-3xl p-4 text-white mb-3 shadow-lg flex items-center justify-between">
        <p className="font-black text-lg">🏠 신혼집 후보 <span className="text-sm font-normal opacity-75">{housing.length}곳</span></p>
        <button onClick={()=>setShowForm(!showForm)} className="bg-white/20 text-white border border-white/30 rounded-xl px-3 py-1.5 text-sm font-semibold active:opacity-70">
          {showForm ? '✕ 닫기' : '+ 추가'}
        </button>
      </div>

      {showForm && (
        <Card className="mb-3 border border-indigo-100">
          <p className="font-bold text-gray-800 mb-3 text-sm">🏘️ 단지 추가</p>
          <HousingFormFields form={addForm} setForm={setAddForm}/>
          <div className="flex gap-2 mt-3">
            <button onClick={()=>setShowForm(false)} className="flex-1 border border-gray-200 rounded-xl py-2.5 text-gray-500 text-sm font-semibold">취소</button>
            <button onClick={handleSave} disabled={!addForm.name||saving} className="flex-1 bg-indigo-500 text-white rounded-xl py-2.5 text-sm font-bold disabled:opacity-40">{saving?'저장중...':'추가 🏠'}</button>
          </div>
        </Card>
      )}

      {/* 정렬 + 필터 */}
      <div className="flex gap-1.5 mb-2 flex-wrap">
        {[['added','등록순'],['price','가격순'],['region','지역순']].map(([v,l])=>(
          <button key={v} onClick={()=>setSort(v)} className={`text-xs px-2.5 py-1 rounded-full font-semibold ${sort===v?'bg-gray-700 text-white':'bg-white text-gray-500 border border-gray-200'}`}>{l}</button>
        ))}
      </div>
      {guList.length > 1 && (
        <div className="flex gap-2 overflow-x-auto pb-2 mb-3 no-scrollbar">
          {guList.map(r=>(
            <button key={r} onClick={()=>setRegionFilter(r)} className={`whitespace-nowrap px-3 py-1 rounded-full text-xs font-semibold ${regionFilter===r?'bg-indigo-500 text-white':'bg-white text-gray-500 border border-gray-200'}`}>{r}</button>
          ))}
        </div>
      )}

      {saving && <p className="text-center text-xs text-indigo-400 mb-2">저장 중...</p>}

      {list.length===0
        ? <Card><p className="text-center text-gray-400 text-sm py-8">아직 저장된 단지가 없어요 🏘️</p></Card>
        : <div className="space-y-2">
            {list.map((h,i)=>{
              const lp = useLongPress(()=>setEditItem(h));
              const builtLabel = getBuiltAge(h.builtYear);
              return (
                <div key={i} {...lp} className="bg-white rounded-2xl shadow-sm select-none active:opacity-70">
                  <div className="px-3 py-2.5">
                    {/* 지역 — 맨 위 왼쪽 */}
                    {h.region && <p className="text-xs text-gray-400 mb-0.5">{h.region}</p>}
                    {/* 단지명 + 가격 */}
                    <div className="flex items-baseline justify-between gap-2 mb-1.5">
                      <p className="font-bold text-gray-800 text-sm leading-tight flex-1 min-w-0 truncate">{h.name}</p>
                      <div className="flex-shrink-0 text-right">
                        {h.salePrice && <p className="text-sm font-bold text-gray-800"><span className="text-gray-400 font-normal text-xs">매매 </span>{h.salePrice}</p>}
                        {h.rentPrice && <p className="text-sm font-bold text-indigo-600"><span className="text-indigo-400 font-normal text-xs">전세 </span>{h.rentPrice}</p>}
                      </div>
                    </div>
                    {/* 부가 정보: 평수, 연식, 메모 */}
                    {(h.pyung||builtLabel||h.memo) && (
                      <div className="flex flex-wrap items-center gap-1.5 mb-2">
                        {h.pyung && <span className="text-xs text-gray-400 bg-gray-50 px-1.5 py-0.5 rounded">{h.pyung}</span>}
                        {builtLabel && <span className="text-xs text-gray-400 bg-gray-50 px-1.5 py-0.5 rounded">{builtLabel}</span>}
                        {h.memo && <span className="text-xs text-gray-400 truncate">{h.memo}</span>}
                      </div>
                    )}
                    {/* 버튼 한 줄: 링크 + 임장 + 후기 */}
                    <div className="flex items-center gap-1.5 flex-wrap">
                      {h.hoganUrl && (
                        <a href={h.hoganUrl} target="_blank" rel="noopener noreferrer"
                           className="text-xs px-2 py-1 rounded-lg font-medium bg-gray-100 text-gray-600 flex items-center gap-0.5"
                           onClick={e=>e.stopPropagation()}>
                          🔗 호갱노노
                        </a>
                      )}
                      {h.naverUrl && (
                        <a href={h.naverUrl} target="_blank" rel="noopener noreferrer"
                           className="text-xs px-2 py-1 rounded-lg font-medium bg-gray-100 text-gray-600 flex items-center gap-0.5"
                           onClick={e=>e.stopPropagation()}>
                          🔗 네이버
                        </a>
                      )}
                      <button onClick={e=>{e.stopPropagation();handleVisitToggle(h);}}
                              className={`text-xs px-2 py-1 rounded-lg font-semibold ${h.visited==='Y'?'bg-emerald-50 text-emerald-600':'bg-gray-50 text-gray-400'}`}>
                        {h.visited==='Y'?'✅ 임장완료':'⬜ 임장예정'}
                      </button>
                      <button onClick={e=>{e.stopPropagation();setReviewTarget(h);setReviewText(h.visitReview||'');}}
                              className="text-xs px-2 py-1 rounded-lg bg-indigo-50 text-indigo-400 font-semibold">
                        {h.visitReview ? '후기 수정' : '+ 후기'}
                      </button>
                    </div>
                    {h.visitReview && <p className="text-xs text-gray-500 bg-gray-50 rounded-lg px-2.5 py-1.5 mt-1.5 italic">"{h.visitReview}"</p>}
                  </div>
                </div>
              );
            })}
          </div>
      }
      <p className="text-center text-xs text-gray-300 mt-3 mb-1">길게 누르면 편집</p>

      {/* 임장 후기 모달 */}
      {reviewTarget && (
        <div className="fixed inset-0 bg-black/50 flex items-end justify-center z-50 p-4" onClick={()=>setReviewTarget(null)}>
          <div className="bg-white rounded-3xl p-5 w-full max-w-md" onClick={e=>e.stopPropagation()}>
            <p className="font-bold text-gray-800 mb-3">📝 임장 후기 — {reviewTarget.name}</p>
            <textarea rows={4} value={reviewText} onChange={e=>setReviewText(e.target.value)} placeholder="임장 후기를 적어주세요..." className={inp + ' resize-none mb-3'} />
            <div className="flex gap-2">
              <button onClick={()=>setReviewTarget(null)} className="flex-1 border border-gray-200 rounded-xl py-2.5 text-gray-500 text-sm font-semibold">취소</button>
              <button onClick={()=>handleReviewSave(reviewTarget)} className="flex-1 bg-indigo-500 text-white rounded-xl py-2.5 text-sm font-bold">저장</button>
            </div>
          </div>
        </div>
      )}

      {editItem && (
        <HousingEditModal
          item={editItem}
          onSave={async(data)=>{ await onEdit(data); setEditItem(null); }}
          onDelete={async(item)=>{ setEditItem(null); await onDelete(item); }}
          onClose={()=>setEditItem(null)}
        />
      )}
    </div>
  );
}

function VendorEditModal({ item, isPlanner, onSave, onDelete, onClose }) {
  const initUrls = isPlanner
    ? (item.url ? item.url.split('|||').filter(Boolean) : [''])
    : (item.homepage ? parseUrls(item.homepage).map(u=>u.url||'') : ['']);
  const [urls, setUrls]       = useState(initUrls.length ? initUrls : ['']);
  const [name, setName]       = useState(item.name||'');
  const [pkg, setPkg]         = useState(item.package||'');
  const [price, setPrice]     = useState(String(item.price||''));
  const [company, setCompany] = useState(item.company||'');
  const [memo, setMemo]       = useState(item.memo||'');
  const [saving, setSaving]   = useState(false);

  function setUrl(i,v) { setUrls(u=>u.map((x,j)=>j===i?v:x)); }
  function addUrl()     { setUrls(u=>[...u,'']); }
  function removeUrl(i) { setUrls(u=>u.filter((_,j)=>j!==i)); }

  async function handleSave() {
    setSaving(true);
    const urlStr = urls.filter(Boolean).join('|||');
    if (isPlanner) await onSave({ ...item, name, company, url:urlStr, price, memo });
    else await onSave({ ...item, name, package:pkg, price:Number(price)||0, homepage:urlStr, memo });
    setSaving(false); onClose();
  }

  return (
    <BottomModal onClose={onClose}>
      <div className="px-5 pb-6">
        <div className="flex items-center justify-between mb-4">
          <p className="font-bold text-gray-800">{isPlanner?'플래너':'업체'} 편집</p>
          <button onClick={onClose} className="text-gray-400 text-lg leading-none">✕</button>
        </div>
        <div className="space-y-2.5">
          <div><label className="text-xs text-gray-500 mb-1 block">이름</label>
            <input value={name} onChange={e=>setName(e.target.value)} className={inp}/>
          </div>
          {isPlanner && <div><label className="text-xs text-gray-500 mb-1 block">소속 업체</label>
            <input value={company} onChange={e=>setCompany(e.target.value)} className={inp}/>

          <div>
            <label className="text-xs text-gray-500 mb-1 block">링크</label>
            {urls.map((u,i)=>(
              <div key={i} className="flex gap-1.5 mb-1.5">
                <input value={u} onChange={e=>setUrl(i,e.target.value)} placeholder="https://..." className={inp+' flex-1'}/>
                {urls.length>1 && <button onClick={()=>removeUrl(i)} className="text-gray-300 px-2 text-lg">✕</button>}
              </div>
            ))}
            <button onClick={addUrl} className="text-xs text-indigo-400 font-semibold">+ 링크 추가</button>
          </div>
          {!isPlanner && <div><label className="text-xs text-gray-500 mb-1 block">패키지 구성</label>
            <textarea rows={3} value={pkg} onChange={e=>setPkg(e.target.value)} className={inp+' resize-none'}/>
          </div>}
          <div><label className="text-xs text-gray-500 mb-1 block">가격</label>
            {isPlanner
              ? <input value={price} onChange={e=>setPrice(e.target.value)} placeholder="150만원~" className={inp}/>
              : <NumInput value={price} onChange={setPrice} placeholder="1,500,000" className={inp}/>
            }
          </div>
          <div><label className="text-xs text-gray-500 mb-1 block">메모</label>
            <input value={memo} onChange={e=>setMemo(e.target.value)} className={inp}/>
          </div>
        </div>
        <div className="flex gap-2 mt-4">
          <button onClick={async()=>{if(window.confirm('삭제할까요?')){await onDelete(item);onClose();}}} className="px-4 py-2.5 bg-red-50 text-red-500 rounded-xl text-sm font-semibold">삭제</button>
          <button onClick={handleSave} disabled={saving} className="flex-1 bg-rose-500 text-white rounded-xl py-2.5 text-sm font-bold disabled:opacity-40">{saving?'저장중...':'저장'}</button>
        </div>
      </div>

  );
}

function VendorForm({ section, listLen, onSave, onCancel }) {

  const [name, setName]   = useState('');
  const [pkg, setPkg]     = useState('');

  function setUrl(i,v) {
    const updated = urls.map((x,j)=>j===i?v:x);
    setUrls(updated);
    if (!name && v) { const p=parseUrl(v); if(p&&p.name&&p.name!==v)setName(p.name); }
  }
  function addUrl()     { setUrls(u=>[...u,'']); }
  function removeUrl(i) { setUrls(u=>u.filter((_,j)=>j!==i)); }

  async function handleSave() {
    setSaving(true);
    const urlStr = urls.filter(Boolean).join('|||');
    const firstParsed = parseUrl(urls.find(Boolean)||'');
    await onSave({ section, num:listLen+1, name:name||urls.find(Boolean)||'', source:firstParsed?.source||'기타', homepage:urlStr, package:pkg, price:Number(price)||0, memo });

  return (

            <div key={i} className="flex gap-1.5 mb-1.5">
              <input value={u} onChange={e=>setUrl(i,e.target.value)} placeholder="https://instagram.com/..." className={inp+' flex-1'}/>

        <div><label className="text-xs text-gray-500 mb-1 block">패키지 구성</label>
          <textarea rows={3} placeholder={"1인 촬영, 앨범 포함\n사진 300장 이상\n영상 별도"} value={pkg} onChange={e=>setPkg(e.target.value)} className={inp+' resize-none'}/>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <div><label className="text-xs text-gray-500 mb-1 block">가격 (원)</label>

          </div>
        </div>
        <div className="flex gap-2">
          <button onClick={onCancel} className="flex-1 border border-gray-200 rounded-xl py-2.5 text-gray-500 text-sm font-semibold">취소</button>
          <button onClick={handleSave} disabled={!name||saving} className="flex-1 bg-rose-500 text-white rounded-xl py-2.5 text-sm font-bold disabled:opacity-40">{saving?'저장중...':'저장 💾'}</button>

function VendorPage({ vendors, planners, onAddVendor, onAddPlanner, onDeletePlanner, onEditVendor, onDeleteVendor, onEditPlanner, onReload }) {
  const [vendorTypes, setVendorTypes] = useState(() => {
    try { return JSON.parse(localStorage.getItem('vendorTypes')) || DEFAULT_VENDOR_TYPES; } catch { return DEFAULT_VENDOR_TYPES; }
  });
  const [tab, setTab]             = useState(vendorTypes[0]||'본식스냅');
  const [showForm, setShowForm]   = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [newType, setNewType]     = useState('');
  const [editItem, setEditItem]   = useState(null);

  function saveTypes(types) { setVendorTypes(types); localStorage.setItem('vendorTypes', JSON.stringify(types)); }
  function addType() { if (!newType.trim()||vendorTypes.includes(newType.trim())) return; saveTypes([...vendorTypes,newType.trim()]); setNewType(''); }
  function removeType(t) { if (!window.confirm(`"${t}" 탭을 삭제할까요?`)) return; const arr=vendorTypes.filter(x=>x!==t); saveTypes(arr); if(tab===t)setTab(arr[0]||''); }

  const isPlanner = tab==='플래너';
  const gsKey = GS_TAB_MAP[tab];
  const list = isPlanner ? planners : (gsKey ? (vendors[gsKey]||[]) : []);
  const emoji = TAB_EMOJI[tab]||'🏢';

  return (
    <div>
      <div className="flex items-center gap-2 mb-3">
        <div className="flex gap-2 overflow-x-auto no-scrollbar flex-1 pb-1">
          {vendorTypes.map(t=>(
            <button key={t} onClick={()=>{setTab(t);setShowForm(false);}} className={`whitespace-nowrap px-3 py-1.5 rounded-full text-sm font-semibold transition-all ${tab===t?'bg-rose-500 text-white':'bg-white text-gray-500 border border-gray-200'}`}>{TAB_EMOJI[t]||'🏢'} {t}</button>
          ))}
        </div>
        <button onClick={()=>setShowSettings(!showSettings)} className="flex-shrink-0 text-gray-400 bg-white border border-gray-200 rounded-full px-2.5 py-1.5 text-sm">⚙️</button>
      </div>

      {showSettings && (
        <Card className="mb-3 border border-gray-200">
          <p className="font-bold text-gray-700 text-sm mb-3">⚙️ 탭 편집</p>
          <div className="space-y-1.5 mb-3">
            {vendorTypes.map(t=>(
              <div key={t} className="flex items-center justify-between bg-gray-50 rounded-xl px-3 py-2">
                <span className="text-sm font-medium">{TAB_EMOJI[t]||'🏢'} {t}</span>
                <button onClick={()=>removeType(t)} className="text-xs text-red-400 font-semibold">삭제</button>
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <input placeholder="새 탭 이름 (예: 예물)" value={newType} onChange={e=>setNewType(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addType()} className={inp+' flex-1'} />
            <button onClick={addType} disabled={!newType.trim()} className="bg-rose-500 text-white rounded-xl px-4 text-sm font-bold disabled:opacity-40">추가</button>
          </div>
        </Card>
      )}

      <div className="flex items-center justify-between mb-3 px-1">
        <p className="font-bold text-gray-700">{emoji} {tab} <span className="text-rose-500">{list.length}개</span></p>
        <button onClick={()=>setShowForm(!showForm)} className="bg-rose-500 text-white rounded-xl px-4 py-2 text-sm font-semibold">{showForm?'닫기':'+ 추가'}</button>
      </div>

      {showForm && (
        isPlanner
          ? <PlannerForm onSave={async d=>{await onAddPlanner(d);setShowForm(false);}} onCancel={()=>setShowForm(false)} />
          : <VendorForm section={gsKey} listLen={list.length} onSave={async d=>{await onAddVendor(d);setShowForm(false);onReload();}} onCancel={()=>setShowForm(false)} />
      )}

      {/* 리스트 */}
      {list.length===0
        ? <Card><p className="text-center text-gray-400 text-sm py-8">링크를 붙여넣어 업체를 추가해보세요! {emoji}</p></Card>
        : <div className="space-y-2">
            {list.map((item,i)=>{
              const lp = useLongPress(()=>setEditItem(item));
              const urlInfos = isPlanner
                ? parseUrls(item.url||'')
                : parseUrls(item.homepage||'');
              return (
                <div key={i} {...lp} className="bg-white rounded-2xl shadow-sm select-none active:opacity-70">
                  <div className="px-4 py-3">
                    {/* 업체명 / 가격 — 가장 중요 */}
                    <div className="flex items-start justify-between gap-2 mb-1">
                      <p className="font-bold text-gray-800 text-sm leading-tight flex-1">{item.name}</p>
                      {!isPlanner && item.price>0 && <p className="font-black text-rose-500 text-sm flex-shrink-0">{fmt(item.price)}원</p>}
                      {isPlanner && item.price && <p className="font-semibold text-rose-500 text-sm flex-shrink-0">{item.price}</p>}
                    </div>
                    {/* 메모 — 서브타이틀 위치 */}
                    {(isPlanner ? item.company : item.memo) && (
                      <p className="text-xs text-gray-400 truncate mb-1.5">{isPlanner ? item.company : item.memo}</p>
                    )}
                    {/* 패키지 구성 — 중요 정보 */}
                    {!isPlanner && item.package && (
                      <p className="text-xs text-gray-600 bg-gray-50 rounded-xl px-3 py-2 mb-2 whitespace-pre-line line-clamp-3">{item.package}</p>
                    )}
                    {isPlanner && item.memo && <p className="text-xs text-gray-400 mb-1.5 italic truncate">{item.memo}</p>}
                    {/* URL 버튼들 — 작고 눈에 덜 띄게 */}
                    {urlInfos.length > 0 && (
                      <div className="flex flex-wrap gap-1">
                        {urlInfos.map((ui,j)=>(
                          <a key={j} href={ui.url} target="_blank" rel="noopener noreferrer"
                             className={`text-xs px-2 py-0.5 rounded-lg font-medium ${URL_COLOR[ui.color]}`}
                             onClick={e=>e.stopPropagation()}>
                            {ui.icon} {ui.name}
                          </a>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
      }
      <p className="text-center text-xs text-gray-300 mt-3 mb-1">길게 누르면 편집</p>

      {editItem && (
        <VendorEditModal
          item={editItem}
          isPlanner={isPlanner}
          onSave={async(data)=>{
            if (isPlanner) await onEditPlanner(data);
            else await onEditVendor(data);
            setEditItem(null); onReload();
          }}
          onDelete={async(item)=>{
            if (isPlanner) await onDeletePlanner(item);
            else await onDeleteVendor(item);
            setEditItem(null); onReload();
          }}
          onClose={()=>setEditItem(null)}
        />
      )}
    </div>
  );
}

// APP ROOT
// ══════════════════════════════════════════════════════════════
function App() {
  const [apiUrl,    setApiUrl]    = useState(()=>localStorage.getItem('weddingApiUrl')||'');
  const [page,      setPage]      = useState('summary');
  const [todos,     setTodos]     = useState([]);
  const [vendors,   setVendors]   = useState({});
  const [housing,   setHousing]   = useState([]);
  const [planners,  setPlanners]  = useState([]);
  const [contracts, setContracts] = useState([]);
  const [loading,   setLoading]   = useState(false);
  const [lastSync,  setLastSync]  = useState(null);

  const api = apiUrl ? makeApi(apiUrl) : null;

  const load = useCallback(async () => {
    if (!api) return;
    setLoading(true);
    try {
      const [t,v,h,p,c] = await Promise.all([
        api('getTodos'), api('getVendors'),
        api('getHousing'), api('getPlanners'), api('getBudgetContracts'),
      ]);
      if (Array.isArray(t)) setTodos(t);
      if (v&&typeof v==='object'&&!v.error) setVendors(v);
      if (Array.isArray(h)) setHousing(h);
      if (Array.isArray(p)) setPlanners(p);
      if (Array.isArray(c)) setContracts(c);
      setLastSync(new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
    } finally { setLoading(false); }
  }, [apiUrl]);

  useEffect(()=>{ load(); }, [load]);

  function handleSaveUrl(url) { localStorage.setItem('weddingApiUrl',url); setApiUrl(url); }

  // ── Todo handlers ──
  async function handleToggle(todo) {
    const next = todo.status==='✅ 완료'?'🔲 미시작':'✅ 완료';
    setTodos(prev=>prev.map(t=>t.num===todo.num?{...t,status:next}:t));
    await api('updateTodo',{num:todo.num,status:next});
  }
  async function handleAddTodo(data) {
    await api('addTodo', data);
    const t = await api('getTodos');
    if (Array.isArray(t)) setTodos(t);
  }
  async function handleEditTodo(data) {
    setTodos(prev=>prev.map(t=>t.rowIndex===data.rowIndex?{...t,...data}:t));
    await api('updateTodoFull', data);
  }
  async function handleDeleteTodo(todo) {
    setTodos(prev=>prev.filter(t=>t.rowIndex!==todo.rowIndex));
    await api('deleteTodo',{rowIndex:todo.rowIndex});
  }

  // ── Budget handlers ──
  async function handleAddContract(data) {
    await api('addBudgetContract',data);
    const c=await api('getBudgetContracts');
    if(Array.isArray(c)) setContracts(c);
  }
  async function handleEditContract(data) {
    setContracts(prev=>prev.map(c=>c.rowIndex===data.rowIndex?{...c,...data}:c));
    await api('updateBudgetContract',data);
  }
  async function handleDeleteContract(item) {
    setContracts(prev=>prev.filter(c=>c.rowIndex!==item.rowIndex));
    await api('deleteBudgetContract',{rowIndex:item.rowIndex});
  }

  // ── Housing handlers ──
  async function handleAddHousing(data) {
    await api('addHousing',data);
    const h=await api('getHousing');
    if(Array.isArray(h)) setHousing(h);
  }
  async function handleEditHousing(data) {
    setHousing(prev=>prev.map(h=>h.rowIndex===data.rowIndex?{...h,...data}:h));
    await api('updateHousingFull',data);
  }
  async function handleDeleteHousing(item) {
    setHousing(prev=>prev.filter(h=>h.rowIndex!==item.rowIndex));
    await api('deleteHousing',{rowIndex:item.rowIndex});
  }
  async function handleUpdateHousing(rowIndex, visited, visitReview) {
    await api('updateHousing',{rowIndex,visited,visitReview});
    setHousing(prev=>prev.map(h=>h.rowIndex===rowIndex?{...h,visited,visitReview}:h));
  }

  // ── Planner/Vendor handlers ──
  async function handleAddPlanner(data) {
    await api('addPlanner',data);
    const p=await api('getPlanners');
    if(Array.isArray(p)) setPlanners(p);
  }
  async function handleDeletePlanner(item) {
    setPlanners(prev=>prev.filter(p=>p.rowIndex!==item.rowIndex));
    await api('deletePlanner',{rowIndex:item.rowIndex});
  }
  async function handleEditPlanner(data) {
    setPlanners(prev=>prev.map(p=>p.rowIndex===data.rowIndex?{...p,...data}:p));
    await api('updatePlanner',data);
  }
  async function handleEditVendor(data) { await api('updateVendor',data); }
  async function handleDeleteVendor(item) { await api('deleteVendor',{rowIndex:item.rowIndex}); }

  if (!apiUrl) return <SetupScreen onSave={handleSaveUrl} />;

  const NAV = [
    { id:'summary', icon:'❤️', label:'요약' },
    { id:'todo',    icon:'✅', label:'할일' },
    { id:'budget',  icon:'💰', label:'예산' },
    { id:'housing', icon:'🏠', label:'신혼집' },
    { id:'wedding', icon:'💍', label:'결혼식' },
    { id:'vendor',  icon:'📸', label:'업체' },
  ];

  return (
    <div className="min-h-screen bg-gray-50">
      <div className="max-w-md mx-auto w-full flex flex-col min-h-screen">
        {/* 헤더 — 작게 */}
        <div className="bg-white border-b border-gray-100 px-4 py-2 flex items-center justify-between sticky top-0 z-20">
          <div>
            <p className="font-black text-gray-800 text-sm leading-tight">나디아 ♡ 최진혁 결혼 준비</p>
            <p className="text-xs text-gray-400">{lastSync ? `${lastSync} 동기화` : '동기화 전'}</p>
          </div>
          <button onClick={load} disabled={loading} className="text-xs bg-rose-50 text-rose-500 border border-rose-100 rounded-lg px-3 py-1.5 font-semibold active:opacity-60 disabled:opacity-40">
            {loading ? '동기화 중...' : '동기화'}
          </button>
        </div>

        {/* 콘텐츠 */}
        <div className="flex-1 overflow-y-auto px-4 pt-4 safe-pb">
          {loading&&todos.length===0
            ? <div className="flex flex-col items-center justify-center h-64 text-gray-400"><div className="text-4xl mb-3 animate-pulse">💍</div><p className="text-sm">데이터 불러오는 중...</p></div>
            : <>
                {page==='summary' && <SummaryPage todos={todos} contracts={contracts}/>}
                {page==='todo'    && <TodoPage todos={todos} onToggle={handleToggle} onAdd={handleAddTodo} onEdit={handleEditTodo} onDelete={handleDeleteTodo}/>}
                {page==='budget'  && <BudgetPage contracts={contracts} onAdd={handleAddContract} onEdit={handleEditContract} onDelete={handleDeleteContract}/>}
                {page==='housing' && <HousingPage housing={housing} onAdd={handleAddHousing} onEdit={handleEditHousing} onDelete={handleDeleteHousing} onUpdateVisit={handleUpdateHousing}/>}
                {page==='wedding' && <WeddingPage todos={todos}/>}
                {page==='vendor'  && <VendorPage vendors={vendors} planners={planners} onAddVendor={d=>api('addVendor',d)} onAddPlanner={handleAddPlanner} onDeletePlanner={handleDeletePlanner} onEditVendor={handleEditVendor} onDeleteVendor={handleDeleteVendor} onEditPlanner={handleEditPlanner} onReload={load}/>}
              </>
          }
        </div>

        {/* 하단 네비게이션 */}
        <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur border-t border-gray-100 safe-nav z-20">
          <div className="flex">
            {NAV.map(n=>(
              <button key={n.id} onClick={()=>setPage(n.id)} className={`flex-1 flex flex-col items-center py-2 transition-colors ${page===n.id?'text-rose-500':'text-gray-400'}`}>
                <span className="text-lg">{n.icon}</span>
                <span className="text-xs mt-0.5 font-semibold">{n.label}</span>
                {page===n.id && <div className="w-1 h-1 rounded-full bg-rose-500 mt-0.5"/>}
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
